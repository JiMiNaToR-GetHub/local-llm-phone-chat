<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0c0c0d" />
<title>Local LLM Chat</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="/marked.min.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div style="display:flex; flex-direction:column; gap:4px; flex:1; min-width:0;">
    <select id="model" title="Select Model"></select>
    <select id="project-select" title="Select Project" style="display:none; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; color: var(--text-main); font-size: 12px; max-width: 200px;"></select>
  </div>
  <button id="agent-btn" class="icon-btn" title="Toggle Agent Mode">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h4V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2zM9 11a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
  </button>
  <button id="wake-btn" class="icon-btn" title="Wake PC" style="color: #30D158;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2zm0 4a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4V6z"/></svg>
  </button>
  <button id="hibernate-btn" class="icon-btn" title="Hibernate PC">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.59-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
  </button>
  <button id="new" class="icon-btn" title="New Chat">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M22 4c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4zm-5 9h-3v3h-2v-3H9v-2h3V8h2v3h3v2z"/></svg>
  </button>
</header>

<div id="status" class="status-bar">
  <span id="status-dot" class="dot waking"></span>
  <span id="status-text">Connecting…</span>
</div>

<main id="messages"></main>

<footer>
  <div id="agent-status" style="display:none; text-align:center; padding-bottom:6px; font-size:12px; color:var(--primary); font-weight:500;">Thinking...</div>
  <div id="metrics-bar" style="display:none; font-size:12px; color:var(--text-muted); text-align:center; padding-bottom:8px; font-family:monospace;">CPU: --% | GPU: --% | VRAM: --GB</div>
  <div id="attachments-preview" style="display:none; flex-wrap:wrap; gap:8px; padding:0 4px 8px 4px; overflow-x:auto; flex-shrink:0;"></div>
  <div class="input-container">
    <textarea id="input" rows="1" placeholder="Message..." enterkeyhint="send"></textarea>
    <button id="project-btn" class="action-btn" title="Browse project files">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
    </button>
    <button id="media-btn" class="action-btn" title="Add photo or file">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <button id="send" class="send-btn" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</footer>

<div id="file-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; flex-direction:column;">
  <div style="background:var(--surface); flex:1; margin:calc(env(safe-area-inset-top) + 20px) 20px 20px 20px; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border);">
    <div style="padding:12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:600; font-size:14px;">Project Files</span>
      <button id="close-modal" style="background:none; border:none; color:var(--text-muted); font-size:24px; padding:0 8px;">&times;</button>
    </div>
    <div id="file-list" style="flex:1; overflow-y:auto; padding:8px;"></div>
  </div>
</div>

<div id="new-project-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); display:flex; flex-direction:column; gap:16px;">
    <h3 style="margin:0; font-size:18px; color:var(--text-main);">New Project</h3>
    <input type="text" id="new-project-name" placeholder="Project name" style="background:var(--surface-alt); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text-main); font-size:16px; outline:none;" />
    <div style="display:flex; gap:12px; justify-content:flex-end;">
      <button id="cancel-project" style="background:transparent; border:none; color:var(--text-muted); padding:12px 16px; font-size:16px;">Cancel</button>
      <button id="create-project" style="background:var(--primary); border:none; color:#fff; padding:12px 16px; border-radius:12px; font-size:16px; font-weight:600;">Create</button>
    </div>
  </div>
</div>

<div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); width:100%; max-width:400px; border-radius:24px; padding:20px; border:1px solid var(--border); display:flex; flex-direction:column; gap:16px;">
    <h3 style="margin:0; font-size:18px; color:var(--text-main);">Allow Tool?</h3>
    <div id="confirm-details" style="font-size:13px; color:var(--text-muted); font-family:monospace; background:var(--surface-alt); padding:12px; border-radius:12px; word-break:break-all; max-height:200px; overflow-y:auto; white-space:pre-wrap;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;">
      <button id="confirm-cancel" style="background:transparent; border:none; color:#FF453A; padding:10px 16px; font-size:15px; cursor:pointer;">Cancel</button>
      <button id="confirm-allow-all" style="background:transparent; border:none; color:var(--text-muted); padding:10px 16px; font-size:15px; cursor:pointer;">Allow All</button>
      <button id="confirm-allow" style="background:var(--primary); border:none; color:#fff; padding:10px 16px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;">Allow</button>
    </div>
  </div>
</div>

<video id="wake-video" muted playsinline style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></video>
<input type="file" id="file-input" accept="image/*,text/plain" multiple style="position: fixed; bottom: -100px; opacity: 0;" />

<script src="/app.js"></script>
</body>
</html>
